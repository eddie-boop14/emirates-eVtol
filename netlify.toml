# Continuous deployment config — UAE eVTOL directory (evtolemirates.com).
# Pre-generated static site: HTML at repo root, no build step.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Self-hosted variable fonts — stable filenames, bytes never change in place.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
