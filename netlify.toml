# Continuous deployment config — UAE eVTOL directory (evtolemirates.com).
# Pre-generated static site: HTML at repo root, no build step.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
